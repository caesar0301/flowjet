name: Build Docker Image

# Images are built manually (workflow_dispatch) by default and automatically
# ONLY when a new release is published. There is NO build on every push/commit.
# Push to Aliyun Container Registry when secrets are set.

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to registry"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  release:
    types: [published]

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  NAMESPACE: lacogito
  IMAGE_NAME: flowjet-server
  # Avoid Docker Hub anonymous rate limits / auth.docker.io timeouts on GHA runners.
  PYTHON_BASE: registry.cn-hangzhou.aliyuncs.com/lacogito/python:3.12-bookworm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Resolve branch tag
        id: branch
        env:
          GH_REF_NAME: ${{ github.ref_name }}
          GH_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          normalized="$(echo "${GH_REF_NAME}" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/^-\+\|-\+$//g')"
          if [ "${GH_REF_TYPE}" = "tag" ]; then
            # Release event: use the tag name verbatim (e.g. v0.1.0) and drop the leading "v"
            # for a semver alias (e.g. 0.1.0).
            image_tag="${normalized}"
            semver="$(echo "${normalized}" | sed -E 's/^v//')"
            echo "name=${normalized}" >> "${GITHUB_OUTPUT}"
            echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
            echo "semver_tag=${semver}" >> "${GITHUB_OUTPUT}"
            echo "Release tag ${GH_REF_NAME} -> image tag ${image_tag} (semver alias ${semver})"
          elif [ "${normalized}" = "main" ]; then
            image_tag="latest"
            echo "name=${normalized}" >> "${GITHUB_OUTPUT}"
            echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
            echo "semver_tag=" >> "${GITHUB_OUTPUT}"
            echo "Branch ${GH_REF_NAME} -> tag ${image_tag}"
          else
            image_tag="latest-${normalized}"
            echo "name=${normalized}" >> "${GITHUB_OUTPUT}"
            echo "image_tag=${image_tag}" >> "${GITHUB_OUTPUT}"
            echo "semver_tag=" >> "${GITHUB_OUTPUT}"
            echo "Branch ${GH_REF_NAME} -> tag ${image_tag}"
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Resolve registry publish eligibility
        id: publish
        env:
          REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          REGISTRY_PASS: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          ready=false
          if [ -n "${REGISTRY_USER}" ] && [ -n "${REGISTRY_PASS}" ]; then ready=true; fi
          echo "registry_secrets_ready=${ready}" >> "${GITHUB_OUTPUT}"

          want=false
          # Always push for release-published events; honor the manual input otherwise.
          if [ "${GH_EVENT_NAME}" = "release" ] || [ "${GH_REF_TYPE}" = "tag" ]; then
            want=true
          elif [ "${{ github.event.inputs.push_image }}" = "true" ]; then
            want=true
          fi
          echo "want_push=${want}" >> "${GITHUB_OUTPUT}"

          should=false
          if [ "${ready}" = "true" ] && [ "${want}" = "true" ]; then should=true; fi
          echo "should_push=${should}" >> "${GITHUB_OUTPUT}"

      - name: Warn when registry push is skipped
        if: ${{ steps.publish.outputs.want_push == 'true' && steps.publish.outputs.should_push != 'true' }}
        run: |
          echo "::warning::Skipping registry push. Configure repository secrets ALIYUN_REGISTRY_USERNAME and ALIYUN_REGISTRY_PASSWORD to publish images."

      # Login before setup-buildx: docker/login-action rewrites DOCKER_CONFIG and would
      # otherwise drop the buildx builder config (see docker/build-push-action#1253).
      - name: Login to Aliyun Container Registry
        if: ${{ steps.publish.outputs.registry_secrets_ready == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.branch.outputs.image_tag }}
            type=raw,value=${{ steps.branch.outputs.semver_tag }},enable=${{ steps.branch.outputs.semver_tag != '' }}
            type=sha,prefix=

      - name: Build and push image (multi-platform)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            PYTHON_BASE=${{ env.PYTHON_BASE }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.publish.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

      - name: Build summary
        run: |
          echo "### Docker Image Built" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Property | Value |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|----------|-------|" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Tag | \`${{ steps.branch.outputs.image_tag }}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Pushed | \`${{ steps.publish.outputs.should_push }}\` |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Registry | \`${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}\` |" >> "${GITHUB_STEP_SUMMARY}"
