[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowjet"
version = "2.0.9"
description = "FlowJet — agent CLI (fj) and server (ACP + OpenAI-compatible HTTP) powered by soothe-nano"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
authors = [{ name = "Xiaming Chen" }]
keywords = ["flowjet", "fj", "cli", "server", "acp", "openai", "agent", "soothe", "nano", "ai", "coding-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# The CLI stays a single-dependency wheel. Everything the HTTP service needs
# lives in the `server` extra, and `flowjet.cli` never imports it at module
# scope (see tests/unit/test_cli_no_server_deps.py).
dependencies = [
    # Default CLI runtime (FLOWJET_BACKEND=soothe). soothe is a host layer over
    # soothe-nano, so nano stays pinned explicitly: soothe only caps it at <2.
    "soothe>=1.0.14,<2.0.0",
    "soothe-nano>=1.3.0,<1.4.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "agent-client-protocol[http]>=0.12.1,<1.0.0",
    "langchain-core>=0.3",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov",
    "ruff>=0.12.0",
    "mypy>=1.0.0",
    "twine>=5.0.0",
    "httpx>=0.27.0",
    "openai>=2.51.0",
]

[dependency-groups]
dev = [
    "flowjet[dev,server]",
]

[tool.uv]
default-groups = ["dev"]
# cryptography 46+ ships macOS wheels for arm64 only; Intel Macs must build from
# source (Rust), which is slow and looks like a hang during `uv sync`.
constraint-dependencies = [
    "cryptography>=45,<46; platform_machine == 'x86_64' and sys_platform == 'darwin'",
]

# soothe-nano is published on PyPI (>=0.9.9); resolve it from the default index.

[project.scripts]
flowjet = "flowjet.cli.cli:main"
fj = "flowjet.cli.cli:main"
fjf = "flowjet.cli.cli:main_follow"
flowjet-server = "flowjet.server.__main__:main"

[project.urls]
Homepage = "https://github.com/caesar0301/flowjet"
Repository = "https://github.com/caesar0301/flowjet"
Issues = "https://github.com/caesar0301/flowjet/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/flowjet"]

[tool.hatch.build.targets.sdist]
include = ["src/flowjet/", "nano.yml", "README.md", "LICENSE", "docs/", "CHANGELOG.md"]

# Non-Python assets (shell completions, builtin_skills/) are shipped automatically
# because they live inside the `src/flowjet` package, which hatchling includes
# recursively. Do NOT re-list them in force-include — that adds the same file
# twice and breaks `uv build` with "A second file is being added ... at the
# same path".

[tool.ruff]
line-length = 100
target-version = "py311"
# AgentSkills scripts are third-party / skill-local style; keep them out of package lint.
extend-exclude = ["src/flowjet/builtin_skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# The moved server/bridge code is Any-heavy (nano and langchain objects); it is
# checked loosely until it is annotated. CI has no mypy gate today.
[[tool.mypy.overrides]]
module = ["flowjet.server.*", "flowjet.core.bridges.*"]
disallow_untyped_defs = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "asyncio: mark test as async",
    "integration: mark test as integration test",
    "server: mark test as covering the HTTP/ACP surface",
]
