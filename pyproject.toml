[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowjet"
version = "2.0.10"
description = "FlowJet — agent CLI (fj) and server (ACP + OpenAI-compatible HTTP) powered by soothe-nano"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
authors = [{ name = "Xiaming Chen" }]
keywords = ["flowjet", "fj", "cli", "server", "acp", "openai", "agent", "soothe", "nano", "ai", "coding-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Single-dependency CLI wheel; HTTP service deps live in the `server` extra.
dependencies = [
    "soothe>=1.1.0,<2.0.0",
    "soothe-nano>=1.4.2,<1.5.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "agent-client-protocol[http]>=0.12.1,<1.0.0",
    "langchain-core>=0.3",
    # S3/MinIO workspace sync backend
    "s3fs>=2024.6",
    # microVM-per-workspace session isolation (https://github.com/boxlite-ai/boxlite)
    "boxlite>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov",
    "ruff>=0.12.0",
    "mypy>=1.0.0",
    "twine>=5.0.0",
    "httpx>=0.27.0",
    "openai>=2.51.0",
]

[dependency-groups]
dev = [
    "flowjet[dev,server]",
]

[tool.uv]
default-groups = ["dev"]
# cryptography 46+ lacks x86_64 macOS wheels; Intel Macs would build from source.
constraint-dependencies = [
    "cryptography>=45,<46; platform_machine == 'x86_64' and sys_platform == 'darwin'",
]

[project.scripts]
flowjet = "flowjet.cli.cli:main"
fj = "flowjet.cli.cli:main"
fjf = "flowjet.cli.cli:main_follow"
flowjet-server = "flowjet.server.__main__:main"

[project.urls]
Homepage = "https://github.com/caesar0301/flowjet"
Repository = "https://github.com/caesar0301/flowjet"
Issues = "https://github.com/caesar0301/flowjet/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/flowjet"]

[tool.hatch.build.targets.sdist]
include = ["src/flowjet/", "nano.yml", "README.md", "LICENSE", "docs/", "CHANGELOG.md"]

# Non-Python assets inside `src/flowjet` ship automatically; re-listing them in
# force-include duplicates files and breaks `uv build`.

[tool.ruff]
line-length = 100
target-version = "py311"
# Third-party / skill-local scripts; excluded from package lint.
extend-exclude = ["src/flowjet/builtin_skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# Any-heavy moved code (nano/langchain objects); loosened until annotated.
[[tool.mypy.overrides]]
module = ["flowjet.server.*", "flowjet.core.bridges.*"]
disallow_untyped_defs = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "asyncio: mark test as async",
    "integration: mark test as integration test",
    "server: mark test as covering the HTTP/ACP surface",
]
